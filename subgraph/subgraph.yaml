specVersion: 1.0.0
schema:
  file: ./schema.graphql

dataSources:
  - kind: ethereum
    name: AchievementNFT
    network: mainnet # TODO: replace
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: replace
      abi: AchievementNFT
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Achievement
      abis:
        - name: AchievementNFT
          file: ./abis/AchievementNFT.json
      eventHandlers:
        - event: TransferSingle(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleTransferSingle
      file: ./src/mapping.ts

  - kind: ethereum
    name: IPNFT
    network: mainnet # TODO: replace
    source:
      address: "0x0000000000000000000000000000000000000000" # TODO: replace
      abi: IPNFT
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - IP
      abis:
        - name: IPNFT
          file: ./abis/IPNFT.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
      file: ./src/mapping.ts 