<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethers库测试</title>
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
    <script>
        function checkEthersLoading() {
            if (typeof ethers === 'undefined') {
                console.error('❌ ethers库未加载');
                document.getElementById('result').innerHTML = '<span style="color: red;">❌ ethers库未加载</span>';
            } else {
                console.log('✅ ethers库已加载');
                document.getElementById('result').innerHTML = '<span style="color: green;">✅ ethers库已加载</span>';
            }
        }

        window.onload = checkEthersLoading;
    </script>
</head>
<body>
    <h1>Ethers库加载测试</h1>
    <div id="result">正在检查...</div>
</body>
</html>
